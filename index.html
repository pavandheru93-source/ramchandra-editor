<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ramchandra GK Quiz</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: #f0f2f5; text-align: center; }
        .navbar { background: #1877f2; color: white; padding: 15px; font-size: 22px; text-align: left; }
        .profile { background: white; width: 350px; margin: 20px auto; padding: 20px; border-radius: 15px; box-shadow: 0px 5px 20px rgba(0,0,0,0.1); }
        .profile img { width: 100px; height: 100px; border-radius: 50%; border: 3px solid #1877f2; object-fit: cover; }
        .quiz-container { background: white; width: 350px; margin: 20px auto; padding: 25px; border-radius: 15px; box-shadow: 0px 5px 25px rgba(0,0,0,0.1); text-align: left; }
        .question { font-size: 18px; font-weight: bold; margin-bottom: 20px; color: #1a1a1a; }
        .option { display: block; background: #f7f8fa; margin: 10px 0; padding: 12px; border-radius: 8px; cursor: pointer; border: 1px solid #ddd; width: 100%; font-size: 16px; text-align: left; }
        .correct { background: #d4edda !important; border-color: #28a745 !important; }
        .wrong { background: #f8d7da !important; border-color: #dc3545 !important; }
        .explanation { display: none; background: #e7f3ff; padding: 15px; border-radius: 10px; margin-top: 15px; border-left: 5px solid #1877f2; font-size: 14px; }
        .btn { background: #1877f2; color: white; padding: 12px; border: none; margin-top: 15px; width: 100%; border-radius: 8px; cursor: pointer; font-weight: bold; }
        #next-btn { display: none; background: #28a745; }
        .footer { margin-top: 30px; color: #777; padding-bottom: 20px; }
    </style>
</head>
<body>

<div class="navbar">🎯 <b>Ramchandra</b> Website</div>

<div class="profile">
    <img src="myphoto.jpg" alt="Ramchandra">
    <h3>रामचंद्र</h3>
    <p style="color: #666;">Rajasthan GK Quiz & Python</p>
</div>

<div class="quiz-container">
    <h3 style="color: #1877f2; text-align: center;">राजस्थान GK क्विज़</h3>
    <div id="quiz-box">
        <p class="question" id="ques-text"></p>
        <div id="options-container"></div>
        <div id="explain-box" class="explanation"></div>
    </div>
    <button id="next-btn" class="btn" onclick="nextQuestion()">अगला सवाल →</button>
</div>

<div class="footer">© 2026 Ramchandra</div>

<script>
    const questions = [
        { q: "1. राजस्थान का 'अबुल फजल' किसे कहा जाता है?", options: ["मुहणौत नैणसी", "जयानक", "चन्दबरदाई", "कन्हैयालाल सेठिया"], ans: 0, exp: "मुहणौत नैणसी को मुंशी देवी प्रसाद ने 'राजस्थान का अबुल फजल' कहा था।" },
        { q: "2. 'मानगढ़ धाम' कहाँ स्थित है?", options: ["चित्तौड़गढ़", "बांसवाड़ा", "डूंगरपुर", "उदयपुर"], ans: 1, exp: "बांसवाड़ा के मानगढ़ धाम को 'राजस्थान का जलियांवाला बाग' कहा जाता है।" },
        { q: "3. 'पाथल और पीथल' के रचयिता कौन थे?", options: ["विजयदान देथा", "कन्हैयालाल सेठिया", "सूर्यमल मिश्रण", "केसरी सिंह"], ans: 1, exp: "यह प्रसिद्ध रचना कन्हैयालाल सेठिया की है।" },
        { q: "4. स्वर्णगिरि किस किले को कहते हैं?", options: ["जैसलमेर", "जालौर", "चित्तौड़गढ़", "जोधपुर"], ans: 1, exp: "जालौर के किले को स्वर्णगिरि कहा जाता है।" },
        { q: "5. 1857 की क्रांति में कितनी सैनिक छावनियां थीं?", options: ["4", "5", "6", "8"], ans: 2, exp: "राजस्थान में कुल 6 सैनिक छावनियां थीं।" }
    ];

    let currentIdx = 0;
    let correctCount = 0; // सही जवाब गिनने के लिए नया वेरिएबल

    function loadQuestion() {
        const q = questions[currentIdx];
        document.getElementById("ques-text").innerText = q.q;
        const container = document.getElementById("options-container");
        container.innerHTML = "";
        document.getElementById("explain-box").style.display = "none";
        document.getElementById("next-btn").style.display = "none";

        q.options.forEach((opt, index) => {
            const btn = document.createElement("button");
            btn.innerText = opt;
            btn.className = "option";
            btn.onclick = () => {
                let btns = document.querySelectorAll(".option");
                btns.forEach(b => b.disabled = true);
                
                if(index === q.ans) {
                    btn.classList.add("correct");
                    correctCount++; // सही जवाब होने पर 1 नंबर जोड़ें
                } else {
                    btn.classList.add("wrong");
                }
                
                document.getElementById("explain-box").style.display = "block";
                document.getElementById("explain-box").innerHTML = "<b>जानकारी:</b> " + q.exp;
                document.getElementById("next-btn").style.display = "block";
            };
            container.appendChild(btn);
        });
    }

    function nextQuestion() {
        currentIdx++;
        if (currentIdx < questions.length) {
            loadQuestion();
        } else {
            // क्विज़ खत्म होने पर स्कोर दिखाना
            document.getElementById("quiz-box").innerHTML = `
                <div style="text-align:center; padding: 20px;">
                    <h2 style="color:#1877f2;">🎊 क्विज़ पूरा हुआ!</h2>
                    <p style="font-size: 22px;">आपका स्कोर: <b>${correctCount} / ${questions.length}</b></p>
                    <button class="btn" onclick="location.reload()">फिर से खेलें</button>
                </div>`;
            document.getElementById("next-btn").style.display = "none";
        }
    }

    loadQuestion();
</script>
</body>
</html>
