<!DOCTYPE html>
<html>
<head>
    <title>Ramchandra Website</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #f0f2f5;
        }

        .navbar {
            background: #1877f2;
            color: white;
            padding: 15px;
            font-size: 22px;
        }

        .navbar span {
            font-weight: bold;
        }

        .container {
            text-align: center;
            padding: 50px;
        }

        .profile {
            background: white;
            width: 300px;
            margin: auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px #ccc;
        }

        .profile img {
            width: 100px;
            border-radius: 50%;
        }

        .btn {
            background: #1877f2;
            color: white;
            padding: 10px;
            border: none;
            margin-top: 10px;
            width: 100%;
            border-radius: 5px;
            cursor: pointer;
        }

        .btn:hover {
            background: #166fe5;
        }

        .footer {
            margin-top: 50px;
            background: #ddd;
            padding: 10px;
        }
    </style>
</head>

<body>

<div class="navbar">
    Welcome <span>Ramchandra</span>
</div>

<div class="container">
    <div class="profile">
        <img src="myphoto.jpg" alt="Ramchandra Photo">
        <h2>Ramchandra</h2>
        <p>Python Learner | Website Developer</p>

        <button class="btn">Contact Me</button>
        <button class="btn">My Projects</button>
    </div>
</div>

<div class="footer">
    © 2026 Ramchandra
</div>

</body>
</html>
